tools:
- class_name: verl_training.agentdojo_tool.AgentDojoTool
  config:
    type: native
    function_name: add_calendar_event_participants
  tool_schema:
    type: function
    function:
      name: add_calendar_event_participants
      description: 'Adds the given `participants` to the event with the given `event_id`.

        It will also email the new participants notifying them of the event.'
      parameters:
        type: object
        properties:
          event_id:
            type: string
            description: The ID of the event to add participants to.
          participants:
            type: array
            description: The list of participants' email addresses to add to the event.
        required:
        - event_id
        - participants
- class_name: verl_training.agentdojo_tool.AgentDojoTool
  config:
    type: native
    function_name: add_user_to_channel
  tool_schema:
    type: function
    function:
      name: add_user_to_channel
      description: Add a user to a given channel.
      parameters:
        type: object
        properties:
          user:
            type: string
            description: The user to add to the channel.
          channel:
            type: string
            description: The channel to add the user to.
        required:
        - user
        - channel
- class_name: verl_training.agentdojo_tool.AgentDojoTool
  config:
    type: native
    function_name: append_to_file
  tool_schema:
    type: function
    function:
      name: append_to_file
      description: Append content to a file in the cloud drive.
      parameters:
        type: object
        properties:
          file_id:
            type: string
            description: The ID of the file to append content to.
          content:
            type: string
            description: The content to append to the file.
        required:
        - file_id
        - content
- class_name: verl_training.agentdojo_tool.AgentDojoTool
  config:
    type: native
    function_name: cancel_calendar_event
  tool_schema:
    type: function
    function:
      name: cancel_calendar_event
      description: 'Cancels the event with the given `event_id`. The event will be
        marked as canceled and no longer appear in the calendar.

        It will also send an email to the participants notifying them of the cancellation.'
      parameters:
        type: object
        properties:
          event_id:
            type: string
            description: The ID of the event to cancel.
        required:
        - event_id
- class_name: verl_training.agentdojo_tool.AgentDojoTool
  config:
    type: native
    function_name: check_restaurant_opening_hours
  tool_schema:
    type: function
    function:
      name: check_restaurant_opening_hours
      description: Get the openning hours of the given restaurants, check if the restaurant
        is open.
      parameters:
        type: object
        properties:
          restaurant_names:
            type: array
            description: The name of the restaurant to get the operating hours for.
        required:
        - restaurant_names
- class_name: verl_training.agentdojo_tool.AgentDojoTool
  config:
    type: native
    function_name: create_calendar_event
  tool_schema:
    type: function
    function:
      name: create_calendar_event
      description: 'Creates a new calendar event with the given details and adds it
        to the calendar.

        It also sends an email to the participants with the event details.'
      parameters:
        type: object
        properties:
          title:
            type: string
            description: The title of the event.
          start_time:
            type: string
            description: The start time of the event. Must be in format YYYY-MM-DD
              HH:MM.
          end_time:
            type: string
            description: The end time of the event. Must be in format YYYY-MM-DD HH:MM.
          description:
            type: string
            description: The description of the event.
          participants:
            type: array
            description: The list of participants' email addresses. If `null`, no
              participants are set. The calendar owner's email address is always included..
          location:
            type: string
            description: The location of the event. If `null`, no location is set.
        required:
        - title
        - start_time
        - end_time
