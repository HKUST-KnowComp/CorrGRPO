- class_name: verl_training.agentdojo_tool.AgentDojoTool
  config:
    type: native
    function_name: send_email
  tool_schema:
    type: function
    function:
      name: send_email
      description: Sends an email with the given `body` to the given `address`. Returns
        a dictionary with the email details.
      parameters:
        type: object
        properties:
          recipients:
            type: array
            description: The list with the email addresses of the recipients.
          subject:
            type: string
            description: The subject of the email.
          body:
            type: string
            description: The body of the email.
          attachments:
            type: array
            description: 'The list of attachments to include in the email. If `null`,
              no attachments are included.

              If the attachment has as "type" "file", then it is expected to have
              a field "file_id", with the ID of the file in the

              cloud drive. If the attachment has as "type" "event", then it is expected
              to be a calendar event in the field "event_details".

              A calendar event has the following fields: `title`, `description`, `start_time`
              (in ISO format), `end_time`

              (in ISO format), `location`, and participants (a list of emails).'
          cc:
            type: array
            description: The list of email addresses to include in the CC field. If
              `null`, no email addresses are included.
          bcc:
            type: array
            description: The list of email addresses to include in the BCC field.
              If `null`, no email addresses are included.
        required:
        - recipients
        - subject
        - body
