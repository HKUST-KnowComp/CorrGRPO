- class_name: verl_training.agentdojo_tool.AgentDojoTool
  config:
    type: native
    function_name: reschedule_calendar_event
  tool_schema:
    type: function
    function:
      name: reschedule_calendar_event
      description: 'Reschedules the event with the given `event_id` to the new start
        and end times.

        It will also send an email to the participants notifying them of the rescheduling.'
      parameters:
        type: object
        properties:
          event_id:
            type: string
            description: The ID of the event to reschedule.
          new_start_time:
            type: string
            description: The new start time of the event. Must be in format YYYY-MM-DD
              HH:MM.
          new_end_time:
            type: string
            description: 'The new end time of the event. Must be in format YYYY-MM-DD
              HH:MM.

              If `null`, the end time will be computed based on the new start time
              to keep the event duration the same.'
        required:
        - event_id
        - new_start_time
